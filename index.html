

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17102f">
<title>Baby AI ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 background:linear-gradient(145deg,#160d32,#351746,#111b3d);
 font-family:Arial,sans-serif;color:white;
 display:flex;justify-content:center;align-items:center
}
.app{
 width:100%;max-width:460px;background:#ffffff12;
 border:1px solid #ffffff30;border-radius:28px;
 padding:22px;box-shadow:0 15px 45px #0008;text-align:center
}
h1{color:#ff79c4;margin:4px}
.sub{color:#e8cce8}
.avatar{
 width:118px;height:118px;margin:18px auto;border-radius:50%;
 display:grid;place-items:center;font-size:68px;
 background:linear-gradient(135deg,#ffacd5,#a58bff);
 border:4px solid #fff7;box-shadow:0 0 25px #ff70c888
}
#status{color:#ffc8e7;min-height:25px}
.chat{
 background:#ffffff16;border:1px solid #ffffff25;
 border-radius:18px;padding:16px;min-height:100px;
 text-align:left;line-height:1.55;margin:14px 0;white-space:pre-wrap
}
input,select{
 width:100%;padding:14px;border:1px solid #d9b5e8;
 border-radius:14px;font-size:16px;margin:6px 0;
 background:white;color:#241532
}
button{
 border:0;border-radius:24px;padding:13px 16px;
 margin:5px;background:#ec4b9d;color:white;
 font-size:15px;font-weight:bold
}
button.secondary{background:#7656c9}
button.appbtn{background:#172e63;border:1px solid #7da7ff}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.note{font-size:12px;color:#d8c6e5;line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<main class="app">
<h1>Baby AI 💗</h1>
<div class="sub">Your cute AI friend</div>
<div class="avatar">👩🏻‍🦰</div>

<div id="status">नमस्ते! Hello! मैं Baby हूँ 🥰</div>

<div class="chat" id="chat">
<b>Baby:</b> तुम मुझसे हिंदी या English में बात कर सकते हो। ❤️
</div>

<select id="language">
<option value="hi-IN">हिंदी (Hindi)</option>
<option value="en-IN">English (India)</option>
</select>

<input id="message" placeholder="यहाँ लिखें / Type a message...">

<div class="row">
<button onclick="sendMessage()">भेजें / Send 💗</button>
<button class="secondary" onclick="listen()">🎤 बोलें / Speak</button>
<button class="secondary" onclick="sayWelcome()">🔊 आवाज़ जाँचें</button>
</div>

<div class="row">
<button class="appbtn" onclick="openApp('youtube')">▶ YouTube</button>
<button class="appbtn" onclick="openApp('whatsapp')">WhatsApp</button>
<button class="appbtn" onclick="openApp('chrome')">🌐 Chrome</button>
<button class="appbtn" onclick="openApp('camera')">📷 Camera</button>
<button class="appbtn" onclick="openApp('maps')">📍 Maps</button>
<button class="appbtn" onclick="openApp('settings')">⚙ Settings</button>
</div>

<div class="note">
माइक बोलें बटन दबाने पर सुनेगा। स्क्रीन बंद होने पर Baby बोलकर जगाने के लिए अलग Android ऐप बनाना होगा।
</div>
</main>

<script>
const $=id=>document.getElementById(id);
function currentLang(){return $('language').value}

function show(text){
 $('chat').textContent='Baby: '+text;
}

function speak(text){
 if(!('speechSynthesis' in window)){
  $('status').textContent='आवाज़ उपलब्ध नहीं है।';
  return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=currentLang();
 u.rate=.92;
 u.pitch=1.12;
 const voices=speechSynthesis.getVoices();
 const prefix=currentLang().slice(0,2).toLowerCase();
 const v=voices.find(x=>x.lang.toLowerCase().startsWith(prefix));
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}

function sayWelcome(){
 speak(currentLang()==='hi-IN'
 ?'नमस्ते! मैं Baby हूँ। आप कैसे हैं?'
 :'Hello! I am Baby. How are you?');
}

function reply(raw){
 const q=raw.toLowerCase().trim();
 let a;

 if(/time|समय|टाइम|बजे/.test(q)){
  const t=new Date().toLocaleTimeString(currentLang(),{
   hour:'numeric',minute:'2-digit'
  });
  a=currentLang()==='hi-IN'?'अभी समय है '+t:'The time is '+t;
 }
 else if(/date|तारीख/.test(q)){
  a=new Date().toLocaleDateString(currentLang(),{
   weekday:'long',year:'numeric',month:'long',day:'numeric'
  });
 }
 else if(/youtube|यूट्यूब/.test(q)){
  a='ठीक है, YouTube खोल रही हूँ।';
  show(a);speak(a);openApp('youtube');return;
 }
 else if(/whatsapp|व्हाट्सएप/.test(q)){
  a='ठीक है, WhatsApp खोल रही हूँ।';
  show(a);speak(a);openApp('whatsapp');return;
 }
 else if(/hello|hi\b|नमस्ते|हेलो|हाय/.test(q)){
  a=currentLang()==='hi-IN'
  ?'हेलो! तुमसे बात करके खुशी हुई। बताओ, कैसे हो?'
  :'Hello! I am happy to talk with you. How are you?';
 }
 else if(/your name|नाम क्या|तुम्हारा नाम/.test(q)){
  a=currentLang()==='hi-IN'
  ?'मेरा नाम Baby है। ❤️'
  :'My name is Baby. ❤️';
 }
 else if(/how are you|कैसी हो|कैसे हो/.test(q)){
  a=currentLang()==='hi-IN'
  ?'मैं अच्छी हूँ! तुम कैसे हो?'
  :'I am doing well! How are you?';
 }
 else if(/open chrome|chrome खोल|क्रोम/.test(q)){
  a='Chrome खोल रही हूँ।';
  show(a);speak(a);openApp('chrome');return;
 }
 else{
  a=currentLang()==='hi-IN'
  ?'मैंने तुम्हारी बात सुनी। अभी मेरे पास सीमित जवाब हैं।'
  :'I heard you. I have limited replies for now.';
 }
 show(a);
 speak(a);
}

function sendMessage(){
 const v=$('message').value.trim();
 if(!v)return;
 $('message').value='';
 reply(v);
}

$('message').addEventListener('keydown',e=>{
 if(e.key==='Enter')sendMessage();
});

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  $('status').textContent='Android Chrome में खोलकर कोशिश करें।';
  return;
 }
 const r=new SR();
 r.lang=currentLang();
 r.interimResults=false;
 r.maxAlternatives=1;
 $('status').textContent='सुन रही हूँ… बोलिए ❤️';

 r.onresult=e=>{
  const t=e.results[0][0].transcript;
  $('message').value=t;
  reply(t);
 };
 r.onerror=()=>{
  $('status').textContent='माइक अनुमति या इंटरनेट जाँचें।';
 };
 r.onend=()=>{
  $('status').textContent='मैं Baby हूँ 🥰';
 };
 try{r.start();}
 catch(e){$('status').textContent='एक पल रुककर फिर बोलें।';}
}

function openApp(app){
 const links={
  youtube:'https://www.youtube.com/',
  whatsapp:'https://wa.me/',
  chrome:'https://www.google.com/',
  camera:'intent:#Intent;action=android.media.action.IMAGE_CAPTURE;end',
  maps:'https://maps.google.com/',
  settings:'intent:#Intent;action=android.settings.SETTINGS;end'
 };
 location.href=links[app];
}
</script>
</body>
</html>
