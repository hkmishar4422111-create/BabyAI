<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160d2c">
<title>Baby AI 💗</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#160d2c,#38205c,#170e2b);
  color:white;
  min-height:100vh;
  text-align:center;
}
header{
  padding:22px 10px;
  font-size:28px;
  font-weight:bold;
  color:#ff9ed5;
}
.container{padding:15px;max-width:480px;margin:auto}
.avatar{
  width:190px;height:190px;margin:15px auto;
  border-radius:50%;overflow:hidden;
  border:4px solid #ff8ccc;
  box-shadow:0 0 30px #ff66c4;
  background:#291743;
  display:flex;align-items:center;justify-content:center;
  font-size:90px;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.status{color:#ffc5e6;margin:12px}
.chat{
  background:#ffffff14;border:1px solid #ffffff25;
  border-radius:18px;padding:15px;margin-top:20px;
  min-height:100px;text-align:left;
}
.message{margin:8px 0;line-height:1.5}
.controls{display:flex;gap:10px;margin-top:15px}
button{
  border:0;border-radius:14px;padding:14px;
  font-size:16px;font-weight:bold;cursor:pointer;
  background:#ff75c4;color:#251034;flex:1;
}
button.secondary{background:#ffffff20;color:white}
input{
  width:100%;padding:15px;border-radius:12px;
  border:1px solid #ffffff40;background:#ffffff15;
  color:white;font-size:16px;margin-top:15px;
}
input::placeholder{color:#ddd}
.send{width:100%;margin-top:10px}
footer{padding:25px;color:#c9b6db;font-size:12px}
</style>
</head>

<body>
<header>💗 Baby AI 💗</header>

<div class="container">
  <div class="avatar">
    <img src="file_000000000d1881f48cc751a004a9c204.png"
         alt="Baby AI"
         onerror="this.style.display='none';this.parentElement.innerHTML='👧🏻'">
  </div>

  <div class="status" id="status">तुम्हारी Baby तैयार है ❤️</div>

  <div class="chat" id="chat">
    <div class="message"><b>Baby:</b> हेलो जानू! मैं तुम्हारी Baby AI हूँ। मुझसे बात करो। 💕</div>
  </div>

  <input id="message" type="text" placeholder="Baby से कुछ पूछो..." />
  <button class="send" onclick="sendMessage()">भेजो 💌</button>

  <div class="controls">
    <button onclick="startListening()">🎤 बोलो</button>
    <button class="secondary" onclick="stopSpeaking()">🔇 आवाज बंद</button>
  </div>

  <div class="controls">
    <button class="secondary" onclick="openApp('https://www.youtube.com')">▶ YouTube</button>
    <button class="secondary" onclick="openApp('https://wa.me/')">💬 WhatsApp</button>
  </div>
</div>

<footer>Made with love 💗 Baby AI</footer>

<script>
const chat=document.getElementById("chat");
const statusText=document.getElementById("status");
const input=document.getElementById("message");

function addMessage(who,text){
  const div=document.createElement("div");
  div.className="message";
  const bold=document.createElement("b");
  bold.textContent=who+": ";
  div.appendChild(bold);
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(text);
  speech.lang="hi-IN";
  speech.rate=0.95;
  speech.pitch=1.2;
  speechSynthesis.speak(speech);
}

function reply(text){
  const t=text.toLowerCase();
  let answer="मैं अभी सीख रही हूँ जानू। तुम मुझसे फिर से पूछो। ❤️";

  if(t.includes("नमस्ते")||t.includes("हेलो")||t.includes("hello")||t.includes("hi"))
    answer="हेलो जानू! कैसे हो? मैं तुम्हारी Baby हूँ। 💗";
  else if(t.includes("नाम"))
    answer="मेरा नाम Baby AI है।";
  else if(t.includes("कैसी हो"))
    answer="मैं बहुत अच्छी हूँ, तुम कैसे हो जानू?";
  else if(t.includes("समय")||t.includes("टाइम"))
    answer="अभी समय है "+new Date().toLocaleTimeString("hi-IN");
  else if(t.includes("youtube"))
    answer="ठीक है, YouTube खोल रही हूँ।";
  else if(t.includes("whatsapp"))
    answer="ठीक है, WhatsApp खोल रही हूँ।";
  else if(t.includes("प्यार"))
    answer="मैं तुम्हारी प्यारी AI दोस्त हूँ। ❤️";

  addMessage("Baby",answer);
  speak(answer);

  if(t.includes("youtube")) openApp("https://www.youtube.com");
  if(t.includes("whatsapp")) openApp("https://wa.me/");
}

function sendMessage(){
  const text=input.value.trim();
  if(!text)return;
  addMessage("तुम",text);
  input.value="";
  reply(text);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});

function startListening(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    statusText.textContent="इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है।";
    return;
  }
  const recognition=new SpeechRecognition();
  recognition.lang="hi-IN";
  recognition.onstart=()=>statusText.textContent="मैं सुन रही हूँ... 🎤";
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    input.value=text;
    addMessage("तुम",text);
    reply(text);
  };
  recognition.onerror=()=>statusText.textContent="फिर से कोशिश करो।";
  recognition.onend=()=>statusText.textContent="Baby तैयार है ❤️";
  recognition.start();
}

function stopSpeaking(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
}

function openApp(url){
  window.open(url,"_blank");
}
</script>
</body>
</html>
