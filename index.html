
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby AI ❤️</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(145deg,#ffe0ed,#e8dfff,#d9f3ff);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #49334c;
}
.app {
  width: 92%;
  max-width: 420px;
  background: #ffffffdd;
  border-radius: 28px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 12px 35px #8c6c9c33;
}
h1 { color: #e65b9b; margin: 5px; }
.avatar {
  width: 135px;
  height: 135px;
  margin: 18px auto;
  border-radius: 50%;
  background: linear-gradient(135deg,#ffb6d5,#c6a8ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 75px;
  box-shadow: 0 5px 20px #d58ab866;
}
#status { color: #9b6390; min-height: 24px; }
.chat {
  background: #fff4fa;
  border-radius: 18px;
  padding: 15px;
  min-height: 85px;
  margin: 15px 0;
  text-align: left;
  line-height: 1.6;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #efc4dc;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}
button {
  border: 0;
  border-radius: 30px;
  padding: 13px 20px;
  margin: 7px 3px;
  background: #e967a5;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:active { transform: scale(.96); }
.mic { background: #9c72dc; font-size: 19px; }
.small { background: #777; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <h1>Baby AI ❤️</h1>
  <div class="avatar">👩🏻</div>
  <div id="status">नमस्ते! मैं Baby हूँ। 🥰</div>

  <div class="chat" id="chat">
    <b>Baby:</b> हाँ जी! बताइए, मैं आपकी क्या मदद करूँ?
  </div>

  <input id="message" placeholder="Baby से कुछ बोलिए या लिखिए...">

  <div>
    <button onclick="sendMessage()">भेजें 💗</button>
    <button class="mic" onclick="listen()">🎤 बोलें</button>
  </div>
  <button class="small" onclick="speak('हाँ Baby, मैं आपकी बात सुन रही हूँ।')">
    🔊 आवाज़ सुनें
  </button>
</div>

<script>
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");

function show(text) {
  chat.innerHTML = "<b>Baby:</b> " + text;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusText.innerText = "इस ब्राउज़र में आवाज़ उपलब्ध नहीं है।";
    return;
  }

  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "hi-IN";
  msg.rate = 0.92;
  msg.pitch = 1.12;

  const voices = speechSynthesis.getVoices();
  const hindiVoice = voices.find(v =>
    v.lang.toLowerCase().startsWith("hi")
  );
  if (hindiVoice) msg.voice = hindiVoice;

  speechSynthesis.speak(msg);
}

function openApp(app) {
  if (app === "youtube") {
    window.location.href = "vnd.youtube://";
    setTimeout(() => {
      window.location.href = "https://www.youtube.com/";
    }, 1200);
  } else {
    window.location.href = "intent://send/#Intent;scheme=whatsapp;package=com.whatsapp;end";
    setTimeout(() => {
      window.location.href = "https://www.whatsapp.com/";
    }, 1200);
  }
}

function reply(text) {
  const q = text.toLowerCase().trim();

  if (q.includes("youtube")) {
    show("हाँ Baby, मैंने खोल दिया YouTube। ❤️");
    speak("हाँ Baby, मैंने खोल दिया YouTube।");
    openApp("youtube");
  }
  else if (q.includes("whatsapp") || q.includes("व्हाट्सएप")) {
    show("हाँ Baby, मैंने खोल दिया WhatsApp। ❤️");
    speak("हाँ Baby, मैंने खोल दिया WhatsApp।");
    openApp("whatsapp");
  }
  else if (q.includes("नमस्ते") || q.includes("हेलो") || q.includes("hello")) {
    const answer = "हेलो Baby! कैसी हैं आप? आपसे बात करके अच्छा लगा।";
    show(answer);
    speak(answer);
  }
  else if (q.includes("कैसी हो") || q.includes("kaisi ho")) {
    const answer = "मैं बिल्कुल अच्छी हूँ Baby। आप बताइए कैसे हैं?";
    show(answer);
    speak(answer);
  }
  else if (q.includes("तुम्हारा नाम") || q.includes("naam kya")) {
    const answer = "मेरा नाम Baby है। मैं आपकी प्यारी AI असिस्टेंट हूँ।";
    show(answer);
    speak(answer);
  }
  else {
    const answer = "हाँ Baby, मैंने आपकी बात सुन ली। अभी मैं सीख रही हूँ।";
    show(answer);
    speak(answer);
  }
}

function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  reply(text);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.innerText =
      "माइक के लिए Android Chrome में खोलकर कोशिश करें।";
    speak("माफ कीजिए Baby, आपका ब्राउज़र आवाज़ नहीं सुन पा रहा।");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  statusText.innerText = "हाँ Baby, मैं सुन रही हूँ... 🎤";

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("message").value = text;
    reply(text);
  };

  recognition.onerror = function() {
    statusText.innerText = "माइक की अनुमति दें और फिर कोशिश करें।";
  };

  recognition.onend = function() {
    statusText.innerText = "मैं Baby हूँ। 🥰";
  };

  recognition.start();
}
</script>
</body>
</html>
